# Build both apps and run their tests on every push and pull request.
#
# The release workflow only runs on a tag, so without this nothing compiled
# either app between releases: a broken build was found halfway through
# cutting one, and the unit tests on both platforms ran only when somebody
# remembered to run them locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The same SDK packages the release workflow installs, so a build that
      # passes here is built the way a release is.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Lint fails the job on an error and only reports warnings.
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  ios:
    name: iOS build and unit tests
    # Pinned rather than macos-latest: the project needs Xcode 26, and the
    # -latest label moves to a new image gradually and without notice.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # The simulator named in docs/ios-setup.md, so the documented command is
      # the one that runs here. No signing: simulator builds do not need it.
      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test -project OpenAVCPanel.xcodeproj -scheme OpenAVCPanel \
            -destination 'platform=iOS Simulator,name=iPad Air 11-inch (M4)' \
            CODE_SIGNING_ALLOWED=NO
