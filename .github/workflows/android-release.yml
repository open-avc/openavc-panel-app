name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Decode release keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain assembleRelease bundleRelease

      - name: Compute SHA-256
        id: sha
        working-directory: android
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          apk_sha=$(sha256sum "$apk" | awk '{print $1}')
          aab_sha=$(sha256sum "$aab" | awk '{print $1}')
          echo "sha256=$apk_sha" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          echo "aab_sha256=$aab_sha" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts with version
        id: rename
        working-directory: android
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk_dest="OpenAVCPanel-$version.apk"
          aab_dest="OpenAVCPanel-$version.aab"
          cp "${{ steps.sha.outputs.apk }}" "$apk_dest"
          cp "${{ steps.sha.outputs.aab }}" "$aab_dest"
          echo "dest=$apk_dest" >> "$GITHUB_OUTPUT"
          echo "aab_dest=$aab_dest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload AAB for Play submission
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ steps.rename.outputs.version }}
          path: android/${{ steps.rename.outputs.aab_dest }}
          if-no-files-found: error

      - name: Record Play upload artifact in job summary
        run: |
          {
            echo "### Google Play upload artifact"
            echo ""
            echo "The signed Android App Bundle for this release is attached to this run as artifact **play-bundle-${{ steps.rename.outputs.version }}**."
            echo ""
            echo "- File: \`${{ steps.rename.outputs.aab_dest }}\`"
            echo "- SHA-256: \`${{ steps.sha.outputs.aab_sha256 }}\`"
            echo ""
            echo "Download it from the Artifacts section of this run and upload it to the Play Console production track. The signed APK is published on the GitHub Release for sideload and enterprise provisioning."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenAVC Panel ${{ steps.rename.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: android/${{ steps.rename.outputs.dest }}
          body: |
            OpenAVC Panel ${{ steps.rename.outputs.version }} for Android.

            **Signed APK SHA-256:** `${{ steps.sha.outputs.sha256 }}`

            ## Install

            Download the APK and install on your Android tablet one of two ways:

            1. **ADB (recommended):** `adb install OpenAVCPanel-${{ steps.rename.outputs.version }}.apk`
            2. **Sideload:** copy the APK to the tablet, tap it in Files, allow "Install unknown apps" for your file manager.

            ## Android Enterprise Provisioning

            For bulk dedicated-panel setup (QR provisioning), the SHA-256 above is the checksum the Android Enterprise provisioning tool needs. See the [Android dedicated panel setup guide](https://docs.openavc.com/panel-app-dedicated-android/) for the full walkthrough.

            ## System Requirements

            Android 8.0 (API 26) or newer. An OpenAVC server reachable on the same network.
