name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Decode release keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain assembleRelease

      - name: Compute SHA-256
        id: sha
        working-directory: android
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          sha=$(sha256sum "$apk" | awk '{print $1}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        id: rename
        working-directory: android
        run: |
          version="${GITHUB_REF_NAME#v}"
          dest="OpenAVCPanel-$version.apk"
          cp "${{ steps.sha.outputs.apk }}" "$dest"
          echo "dest=$dest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenAVC Panel ${{ steps.rename.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: android/${{ steps.rename.outputs.dest }}
          body: |
            OpenAVC Panel ${{ steps.rename.outputs.version }} for Android.

            **Signed APK SHA-256:** `${{ steps.sha.outputs.sha256 }}`

            ## Install

            Download the APK and install on your Android tablet one of two ways:

            1. **ADB (recommended):** `adb install OpenAVCPanel-${{ steps.rename.outputs.version }}.apk`
            2. **Sideload:** copy the APK to the tablet, tap it in Files, allow "Install unknown apps" for your file manager.

            ## Android Enterprise Provisioning

            For bulk dedicated-panel setup (QR provisioning), the SHA-256 above is the checksum the Android Enterprise provisioning tool needs. See the [Android dedicated panel setup guide](https://docs.openavc.com/panel-app-dedicated-android/) for the full walkthrough.

            ## System Requirements

            Android 8.0 (API 26) or newer. An OpenAVC server reachable on the same network.

  bundle:
    name: Build signed AAB for Play
    runs-on: ubuntu-latest
    # No `needs:` on purpose. This job is independent of the APK job so a
    # bundle failure cannot take the GitHub Release down with it -- the APK
    # is what sideload and Android Enterprise provisioning depend on, and it
    # has to publish whether or not Play gets a bundle this time.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Decode release keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/release.jks" >> "$GITHUB_ENV"

      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon --console=plain bundleRelease

      - name: Name it and hash it
        id: bundle
        working-directory: android
        run: |
          version="${GITHUB_REF_NAME#v}"
          src="app/build/outputs/bundle/release/app-release.aab"
          dest="OpenAVCPanel-$version.aab"
          cp "$src" "$dest"
          sha=$(sha256sum "$dest" | awk '{print $1}')
          echo "dest=$dest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload AAB for Play submission
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ steps.bundle.outputs.version }}
          path: android/${{ steps.bundle.outputs.dest }}
          if-no-files-found: error

      - name: Record the Play upload artifact in the job summary
        run: |
          {
            echo "### Google Play upload artifact"
            echo ""
            echo "Signed bundle for this release: artifact **play-bundle-${{ steps.bundle.outputs.version }}** on this run."
            echo ""
            echo "- File: \`${{ steps.bundle.outputs.dest }}\`"
            echo "- SHA-256: \`${{ steps.bundle.outputs.sha256 }}\`"
            echo ""
            echo "Download it from this run's Artifacts section and upload it to the Play Console."
            echo "It is NOT attached to the GitHub Release: the release carries the APK, which is what"
            echo "sideload and Android Enterprise provisioning use."
          } >> "$GITHUB_STEP_SUMMARY"
